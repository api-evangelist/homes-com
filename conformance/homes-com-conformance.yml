summary: >-
  Homes.com conforms to no API-facing standard, because it exposes no API. The
  real-estate-specific standards (RESO Data Dictionary, RESO Web API/OData,
  UPI) are all NOT conformed to, and that absence is independently verified
  against RESO's own certification directory rather than inferred from
  unreachability. The only standards this provider can evidence conformance to
  are corporate security frameworks published by its parent, CoStar Group.
standards:
