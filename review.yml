actions:
  apisYmlCreated: true
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  reason: >-
    No first-party API, OpenAPI document, OData $metadata, AsyncAPI, GraphQL
    schema, webhook contract, SDK, or Postman collection exists to record.
    Recording an empty apis[] is the accurate outcome for this provider. The
    unofficial Homes.com "APIs" sold on RapidAPI, Apify, Parse, and RealtyAPI
    are third-party scrapers and were deliberately excluded — they are not
    provider-published surfaces.
